<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" width="100%" height="320">
  <defs>
    <linearGradient id="bgBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101d" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <linearGradient id="glowBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <style>
      .panel-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 1px;
      }
      .panel-desc {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 400;
        font-size: 12px;
        fill: #94a3b8;
      }
    </style>
  </defs>

  <rect width="1100" height="320" rx="14" fill="url(#bgBox)" stroke="url(#glowBorder)" stroke-width="1.2" />

  <!-- TOP HEADER -->
  <text x="50" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="14px" fill="#f8fafc" letter-spacing="1.5px">
    SYNTHESIS PROGRESSION STRIP: 2D SKETCH ➔ 2D IMAGE ➔ 3D ASSET
  </text>
  <line x1="50" y1="52" x2="1050" y2="52" stroke="#334155" stroke-width="1" />

  <!-- COLUMN 1: SKETCH -->
  <g transform="translate(50, 70)">
    <rect width="280" height="200" rx="10" fill="#030712" stroke="#38bdf8" stroke-width="1" />
    <!-- Canvas Inner -->
    <rect x="15" y="15" width="250" height="135" rx="6" fill="#090d16" />
    <!-- Sketch graphics (vase/goblet example) -->
    <path d="M 110 35 Q 140 30 170 35 Q 155 75 165 105 Q 180 120 180 135 L 100 135 Q 100 120 115 105 Q 125 75 110 35 Z" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <ellipse cx="140" cy="35" rx="30" ry="7" fill="none" stroke="#38bdf8" stroke-width="1.8" />
    <ellipse cx="140" cy="135" rx="40" ry="8" fill="none" stroke="#64748b" stroke-width="1.5" />
    
    <text x="15" y="172" class="panel-title" fill="#38bdf8">1. HAND-DRAWN SKETCH</text>
    <text x="15" y="190" class="panel-desc">Raw doodle input on digital canvas or paper</text>
  </g>

  <!-- TRANSITION 1 -->
  <g transform="translate(345, 160)">
    <circle cx="20" cy="0" r="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
    <path d="M 16 -6 L 24 0 L 16 6" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- COLUMN 2: 2D DIFFUSION -->
  <g transform="translate(400, 70)">
    <rect width="280" height="200" rx="10" fill="#030712" stroke="#818cf8" stroke-width="1" />
    <!-- Canvas Inner -->
    <rect x="15" y="15" width="250" height="135" rx="6" fill="#1e1b4b" fill-opacity="0.4" />
    <!-- Shaded Goblet -->
    <path d="M 110 35 Q 140 30 170 35 Q 155 75 165 105 Q 180 120 180 135 L 100 135 Q 100 120 115 105 Q 125 75 110 35 Z" fill="#6366f1" fill-opacity="0.7" stroke="#a5b4fc" stroke-width="1.5" />
    <ellipse cx="140" cy="35" rx="30" ry="7" fill="#818cf8" />
    <ellipse cx="140" cy="135" rx="40" ry="8" fill="#4338ca" />
    <path d="M 118 45 Q 130 80 135 105" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.6" stroke-linecap="round" />

    <text x="15" y="172" class="panel-title" fill="#818cf8">2. 2D SYNTHESIS + PROMPT</text>
    <text x="15" y="190" class="panel-desc">ControlNet Scribble + SD 1.5 photorealism</text>
  </g>

  <!-- TRANSITION 2 -->
  <g transform="translate(695, 160)">
    <circle cx="20" cy="0" r="16" fill="#1e293b" stroke="#34d399" stroke-width="1.2" />
    <path d="M 16 -6 L 24 0 L 16 6" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- COLUMN 3: 3D RECONSTRUCTION -->
  <g transform="translate(750, 70)">
    <rect width="300" height="200" rx="10" fill="#030712" stroke="#34d399" stroke-width="1" />
    <!-- Viewport Inner -->
    <rect x="15" y="15" width="270" height="135" rx="6" fill="#064e3b" fill-opacity="0.25" />
    
    <!-- 3D Model with mesh wire and shading -->
    <g transform="translate(150, 80)">
      <ellipse cx="0" cy="45" rx="55" ry="14" fill="none" stroke="#34d399" stroke-width="1" stroke-dasharray="3 3" />
      
      <!-- Faceted 3D Object -->
      <polygon points="0,-45 35,-20 0,0 -35,-20" fill="#34d399" fill-opacity="0.4" stroke="#6ee7b7" stroke-width="1.2" />
      <polygon points="-35,-20 0,0 0,40 -35,20" fill="#059669" fill-opacity="0.6" stroke="#6ee7b7" stroke-width="1.2" />
      <polygon points="0,0 35,-20 35,20 0,40" fill="#10b981" fill-opacity="0.8" stroke="#6ee7b7" stroke-width="1.2" />

      <circle cx="0" cy="-45" r="2.5" fill="#ffffff" />
      <circle cx="35" cy="-20" r="2.5" fill="#ffffff" />
      <circle cx="-35" cy="-20" r="2.5" fill="#ffffff" />
      <circle cx="0" cy="40" r="2.5" fill="#ffffff" />
      <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
    </g>

    <text x="15" y="172" class="panel-title" fill="#34d399">3. 3D WATERTIGHT GLB</text>
    <text x="15" y="190" class="panel-desc">TripoSR NeRF + PBR COLOR_0 Material</text>
  </g>
</svg>