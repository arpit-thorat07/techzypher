<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0c1222" />
      <stop offset="100%" stop-color="#11192e" />
    </linearGradient>

    <!-- Neon Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe">
        <animate attributeName="stop-color" values="#00f2fe;#4facfe;#9b51e0;#00f2fe" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#4facfe">
        <animate attributeName="stop-color" values="#4facfe;#9b51e0;#00f2fe;#4facfe" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#9b51e0">
        <animate attributeName="stop-color" values="#9b51e0;#00f2fe;#4facfe;#9b51e0" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#9b51e0" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2d4d" stroke-width="0.8" stroke-opacity="0.3" />
    </pattern>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 900;
        font-size: 56px;
        letter-spacing: 4px;
        fill: url(#titleGrad);
        filter: url(#glow);
      }
      .tagline-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        letter-spacing: 1.5px;
        fill: #e2e8f0;
      }
      .subtag-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 400;
        font-size: 14px;
        letter-spacing: 1px;
        fill: #94a3b8;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 1px;
      }
      .cube-wire {
        stroke: #00f2fe;
        stroke-width: 1.5;
        fill: none;
        opacity: 0.7;
        animation: rotateCube 12s linear infinite;
        transform-origin: 1040px 170px;
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.7; }
      }
      .pulsing-glow {
        animation: pulseGlow 4s ease-in-out infinite;
      }
      @keyframes floatAnim {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      .floating-group {
        animation: floatAnim 5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Box -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="340" rx="16" fill="url(#grid)" />

  <!-- Outer Neon Border -->
  <rect x="2" y="2" width="1196" height="336" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Corner Tech Highlights -->
  <path d="M 2 30 L 2 2 L 30 2" fill="none" stroke="#00f2fe" stroke-width="3" />
  <path d="M 1198 30 L 1198 2 L 1170 2" fill="none" stroke="#00f2fe" stroke-width="3" />
  <path d="M 2 310 L 2 338 L 30 338" fill="none" stroke="#00f2fe" stroke-width="3" />
  <path d="M 1198 310 L 1198 338 L 1170 338" fill="none" stroke="#00f2fe" stroke-width="3" />

  <!-- Radial Glow Behind Title -->
  <circle cx="450" cy="150" r="180" fill="#00f2fe" opacity="0.08" class="pulsing-glow" filter="url(#glow)" />
  <circle cx="650" cy="170" r="150" fill="#9b51e0" opacity="0.08" class="pulsing-glow" filter="url(#glow)" />

  <!-- Top Tech Badge Pill -->
  <g transform="translate(80, 50)">
    <rect x="0" y="0" width="280" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="14" r="5" fill="#10b981">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="19" class="pill-text" fill="#38bdf8">TECHZEPHYR 4.0 • 12H HACKATHON</text>
  </g>

  <g transform="translate(375, 50)">
    <rect x="0" y="0" width="190" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="14" y="19" class="pill-text" fill="#a78bfa">⚡ COLAB T4 OPTIMIZED</text>
  </g>

  <!-- Hero Main Title -->
  <g transform="translate(80, 140)">
    <text x="0" y="0" class="title-text">SKETCH2SHAPE AI</text>
  </g>

  <!-- Main Value Proposition Tagline -->
  <g transform="translate(80, 190)">
    <text x="0" y="0" class="tagline-text">Draw it. Describe it. Hold it in 3D.</text>
  </g>

  <!-- Secondary Descriptive Line -->
  <g transform="translate(80, 225)">
    <text x="0" y="0" class="subtag-text">End-to-End Multimodal 3D Synthesis: 2D Hand Sketches &amp; Prompts ➔ Watertight PBR GLB Meshes in ~60 Seconds</text>
  </g>

  <!-- Right Side Visual Iconography (3D Geometric Hologram) -->
  <g class="floating-group" transform="translate(1010, 165)">
    <!-- Outer Glow Orbit -->
    <circle cx="0" cy="0" r="85" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="8 6" opacity="0.4">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="110" fill="none" stroke="#a855f7" stroke-width="1" stroke-dasharray="12 8" opacity="0.3">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="30s" repeatCount="indefinite" />
    </circle>

    <!-- Isometric 3D Wireframe Cube -->
    <!-- Top Face -->
    <polygon points="0,-60 52,-30 0,0 -52,-30" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.8" />
    <!-- Left Face -->
    <polygon points="-52,-30 0,0 0,60 -52,30" fill="#6366f1" fill-opacity="0.25" stroke="#818cf8" stroke-width="1.8" />
    <!-- Right Face -->
    <polygon points="0,0 52,-30 52,30 0,60" fill="#a855f7" fill-opacity="0.35" stroke="#c084fc" stroke-width="1.8" />

    <!-- Center Coordinate Axes -->
    <line x1="0" y1="0" x2="0" y2="-55" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8" />
    <line x1="0" y1="0" x2="48" y2="28" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8" />
    <line x1="0" y1="0" x2="-48" y2="28" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.8" />

    <!-- Floating Node Spheres -->
    <circle cx="0" cy="-60" r="4" fill="#00f2fe" filter="url(#softGlow)" />
    <circle cx="52" cy="-30" r="4" fill="#a855f7" filter="url(#softGlow)" />
    <circle cx="-52" cy="-30" r="4" fill="#38bdf8" filter="url(#softGlow)" />
    <circle cx="0" cy="60" r="4" fill="#c084fc" filter="url(#softGlow)" />
    <circle cx="0" cy="0" r="5" fill="#ffffff" filter="url(#glow)" />
  </g>
</svg>